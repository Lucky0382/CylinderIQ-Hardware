; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = s3

[common]
platform = espressif32@6.6.0
framework = espidf
monitor_speed = 115200
upload_speed = 921600

[env:s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_port = COM7
upload_port = COM7
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_src_filter = +<*> -<../src_c6/>
build_flags =
	-DBOARD_S3
	-DLOG_LOCAL_LEVEL=ESP_LOG_INFO
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.s3"

[env:c6]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_port = COM5
upload_port = COM5
build_src_filter = +<../src_c6/> -<*>
build_flags =
	-DBOARD_C6
	-DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
	-Wl,--allow-multiple-definition
	-Wl,--wrap=temperature_sensor_install
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.c6"
