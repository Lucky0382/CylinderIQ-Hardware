name: Build ESP32-C6 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build C6 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build C6 Firmware
        run: pio run -e c6

      - name: Create Merged Binary
        run: |
          python -m esptool --chip esp32c6 merge-bin \
            -o c6-firmware-merged.bin \
            --flash-mode dio \
            --flash-size 4MB \
            0x0000 .pio/build/c6/bootloader.bin \
            0x8000 .pio/build/c6/partitions.bin \
            0x10000 .pio/build/c6/firmware.bin || \
          python -m esptool --chip esp32c6 merge_bin \
            -o c6-firmware-merged.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x0000 .pio/build/c6/bootloader.bin \
            0x8000 .pio/build/c6/partitions.bin \
            0x10000 .pio/build/c6/firmware.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c6-firmware
          path: |
            c6-firmware-merged.bin
            .pio/build/c6/bootloader.bin
            .pio/build/c6/partitions.bin
            .pio/build/c6/firmware.bin
          retention-days: 7
