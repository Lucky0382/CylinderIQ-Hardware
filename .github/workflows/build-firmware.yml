name: Build Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-s3:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-s3-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-s3-
            ${{ runner.os }}-pio-

      - name: Build S3 Firmware
        run: pio run -e s3

      - name: Create Merged Binary
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o s3-firmware-merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0000 .pio/build/s3/bootloader.bin \
            0x8000 .pio/build/s3/partitions.bin \
            0x10000 .pio/build/s3/firmware.bin

      - name: Upload S3 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s3-firmware-${{ github.sha }}
          path: |
            s3-firmware-merged.bin
            .pio/build/s3/bootloader.bin
            .pio/build/s3/partitions.bin
            .pio/build/s3/firmware.bin
            .pio/build/s3/firmware.elf
          retention-days: 30

  build-c6:
    name: Build ESP32-C6 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-c6-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-c6-
            ${{ runner.os }}-pio-

      - name: Build C6 Firmware
        run: pio run -e c6

      - name: Create Merged Binary
        run: |
          python -m esptool --chip esp32c6 merge_bin \
            -o c6-firmware-merged.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x0000 .pio/build/c6/bootloader.bin \
            0x8000 .pio/build/c6/partitions.bin \
            0x10000 .pio/build/c6/firmware.bin

      - name: Upload C6 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c6-firmware-${{ github.sha }}
          path: |
            c6-firmware-merged.bin
            .pio/build/c6/bootloader.bin
            .pio/build/c6/partitions.bin
            .pio/build/c6/firmware.bin
            .pio/build/c6/firmware.elf
          retention-days: 30
